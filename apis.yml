aid: honess
name: HONESS (Shanghai Hongji Environmental Protection)
description: HONESS (泓济环保 / Shanghai Hongji Environmental Protection, honess.cn) is a Chinese
  environmental services provider founded in 2006, specializing in industrial wastewater treatment and
  the broader treatment of the "three wastes" (wastewater, waste gas, and hazardous waste). It offers
  customized environmental solutions, environmental equipment manufacturing and integration, EPC delivery
  for energy and chemical full-water systems, fine-chemical waste treatment, process packages for new and
  upgraded wastewater plants, and technology-enabled ("smart") digital operations and maintenance. The
  company holds top-grade design and contracting qualifications, has delivered 500+ design/build/operation
  projects for 300+ clients across China and abroad, and operates manufacturing and R&D bases in Shanghai
  and Anhui. It is not a developer/API company; the public surface is a WordPress corporate site with no
  developer portal, API documentation, SDKs, or OAuth. Surfaced as a portfolio company of Qiming Venture
  Partners and profiled in the API Evangelist network.
